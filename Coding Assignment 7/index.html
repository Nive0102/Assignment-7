<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BadBank Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fff0f6; }
    .navbar, .btn-primary { background: #ec4899; }
    .navbar { padding: 15px 25px; }
    .card { border: 1px solid #f9a8d4; border-radius: 15px; }
    #balanceDisplay { color: #ec4899; font-weight: bold; }
    .nav-pills { background: #fce7f3; border-radius: 10px; }
    .nav-pills .nav-link { color: #be185d; }
    .nav-pills .nav-link.active { background: #ec4899; }
    .btn-primary { border: none; }
    .btn-primary:hover { background: #db2777; }
    .form-control:focus { border-color: #ec4899; box-shadow: 0 0 5px #f9a8d4; }
    .form-label { color: #9d174d; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <span class="navbar-brand">BadBank Portal</span>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 text-center mb-4">
          <h5>Account Balance</h5>
          <h2 id="balanceDisplay">$100.00</h2>
        </div>

        <div class="card p-4">
          <ul class="nav nav-pills nav-fill mb-3">
            <li class="nav-item"><button class="nav-link active w-100" id="depositTab" onclick="switchAction('deposit')">Deposit</button></li>
            <li class="nav-item"><button class="nav-link w-100" id="withdrawTab" onclick="switchAction('withdraw')">Withdraw</button></li>
          </ul>

          <label class="form-label" id="actionLabel">Deposit Amount</label>
          <input type="number" class="form-control mb-3" id="amountInput" placeholder="Enter amount" min="0.01" step="0.01">
          <button class="btn btn-primary w-100" id="actionBtn" onclick="handleTransaction()">Deposit Money</button>
          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let balance = 100, mode = "deposit";

    function switchAction(type) {
      mode = type;
      document.getElementById("amountInput").value = "";
      document.getElementById("alertBox").innerHTML = "";
      document.getElementById("depositTab").classList.toggle("active", type === "deposit");
      document.getElementById("withdrawTab").classList.toggle("active", type === "withdraw");
      document.getElementById("actionLabel").innerText = type === "deposit" ? "Deposit Amount" : "Withdraw Amount";
      document.getElementById("actionBtn").innerText = type === "deposit" ? "Deposit Money" : "Withdraw Money";
    }

    function handleTransaction() {
      const input = document.getElementById("amountInput"), val = Number(input.value);
      const alertBox = document.getElementById("alertBox");

      if (input.value.trim() === "" || !Number.isFinite(val) || val <= 0) {
        alertBox.innerHTML = '<div class="alert alert-danger">Enter a valid positive amount.</div>';
        return;
      }

      if (mode === "withdraw" && val > balance) {
        alertBox.innerHTML = '<div class="alert alert-warning">Insufficient balance!</div>';
        return;
      }

      balance += mode === "deposit" ? val : -val;
      document.getElementById("balanceDisplay").innerText = "$" + balance.toFixed(2);
      alertBox.innerHTML = `<div class="alert alert-success">Successfully ${mode === "deposit" ? "deposited" : "withdrew"} $${val.toFixed(2)}!</div>`;
      input.value = "";
    }
  </script>
</body>
</html>
